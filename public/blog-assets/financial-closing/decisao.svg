<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Proposta e decisão da produtividade</title><desc id="desc">Ilustração da interface do CoBudget mostrando uma proposta em rascunho antes da autorização.</desc>
  <rect width="1200" height="675" fill="#f8f3eb"/><rect x="54" y="42" width="1092" height="591" rx="28" fill="#fff" stroke="#e9d6c4" stroke-width="3"/>
  <text x="104" y="116" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#667085">PRODUTIVIDADE E VALOR A RECEBER</text><text x="104" y="172" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#132238">Confira a proposta antes de enviar</text><rect x="929" y="86" width="116" height="42" rx="21" fill="#fff1e5"/><text x="953" y="114" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#bd5b20">RASCUNHO</text>
  <rect x="104" y="224" width="260" height="158" rx="18" fill="#f5f7fa"/><text x="134" y="271" font-family="Arial, sans-serif" font-size="20" fill="#667085">PRODUTIVIDADE LÍQUIDA</text><text x="134" y="337" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#132238">R$ 82.805,99</text>
  <rect x="392" y="224" width="260" height="158" rx="18" fill="#fff" stroke="#bd5b20" stroke-width="3"/><text x="422" y="271" font-family="Arial, sans-serif" font-size="20" fill="#667085">VALOR A RECEBER</text><text x="422" y="337" font-family="Arial, sans-serif" font-size="35" font-weight="700" fill="#132238">R$ 70.385,10</text>
  <rect x="680" y="224" width="365" height="158" rx="18" fill="#f5f7fa"/><text x="710" y="271" font-family="Arial, sans-serif" font-size="20" fill="#667085">ANTES DE AVANÇAR</text><text x="710" y="324" font-family="Arial, sans-serif" font-size="24" fill="#132238">Revise participantes,</text><text x="710" y="356" font-family="Arial, sans-serif" font-size="24" fill="#132238">valores e vencimentos.</text>
  <rect x="665" y="495" width="380" height="68" rx="14" fill="#bd5b20"/><text x="730" y="539" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">ENVIAR PARA AUTORIZAÇÃO</text>
  <text x="104" y="541" font-family="Arial, sans-serif" font-size="22" fill="#1f8279">A proposta é editável enquanto permanece em rascunho.</text>
</svg>
