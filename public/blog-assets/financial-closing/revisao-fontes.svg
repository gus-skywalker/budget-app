<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Revisão assistida de fontes</title><desc id="desc">Ilustração da interface do CoBudget mostrando fontes de uma planilha e exceções a revisar.</desc>
  <rect width="1200" height="675" fill="#f8f3eb"/><rect x="54" y="42" width="1092" height="591" rx="28" fill="#fff" stroke="#e9d6c4" stroke-width="3"/>
  <text x="104" y="116" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#667085">IMPORTAÇÃO DA COMPETÊNCIA</text><text x="104" y="172" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#132238">Revise cada fonte antes de publicar</text>
  <rect x="104" y="222" width="455" height="125" rx="16" fill="#eff8f5"/><circle cx="145" cy="285" r="18" fill="#1f8279"/><text x="182" y="273" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#132238">REPASSE BP PAULISTA</text><text x="182" y="310" font-family="Arial, sans-serif" font-size="20" fill="#51706b">Perfil tabular pronto para revisão</text>
  <rect x="104" y="371" width="455" height="125" rx="16" fill="#fff7ed"/><circle cx="145" cy="434" r="18" fill="#bd5b20"/><text x="182" y="422" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#132238">PROADI SUS BP</text><text x="182" y="459" font-family="Arial, sans-serif" font-size="20" fill="#80634f">Participantes e linhas exigem revisão</text>
  <rect x="615" y="222" width="430" height="274" rx="18" fill="#f5f7fa"/><text x="651" y="270" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#667085">O QUE VOCÊ CONFIRMA</text><text x="651" y="328" font-family="Arial, sans-serif" font-size="27" fill="#132238">1. Quem recebe os valores</text><text x="651" y="378" font-family="Arial, sans-serif" font-size="27" fill="#132238">2. Referências repetidas</text><text x="651" y="428" font-family="Arial, sans-serif" font-size="27" fill="#132238">3. Linhas inválidas</text>
  <rect x="615" y="531" width="430" height="58" rx="12" fill="#bd5b20"/><text x="738" y="568" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">PREPARAR LOTE</text>
</svg>
